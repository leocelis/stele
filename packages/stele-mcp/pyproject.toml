[project]
name = "stele-mcp"
version = "18.15.0"
description = "MCP stdio server for Stele — named tools over the governed experiential-memory ledger."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stele contributors" }]
keywords = ["mcp", "ai-agents", "memory", "stele"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
dependencies = [
    "stele-core",
    "mcp>=1.0,<2",
]

[project.urls]
Documentation = "docs/TECH_SPEC.md"

[project.scripts]
stele-mcp = "stele_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stele_mcp"]

[tool.uv.sources]
stele-core = { workspace = true }
