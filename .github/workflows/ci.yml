# Stele CI — purity + constraint suites (monorepo layout).
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -e packages/stele-core -e packages/stele-mcp
      - name: Lint (ruff)
        run: ruff check packages/ examples/
      - name: Types (mypy)
        run: mypy packages/stele-core/src/stele_core packages/stele-mcp/src/stele_mcp
      - name: Tests
        run: pytest -q
      - name: Proof run
        run: python examples/proof_run.py
      - name: Determinism smoke
        run: |
          python examples/lifecycle_demo.py > run1.txt
          python examples/lifecycle_demo.py > run2.txt
          diff run1.txt run2.txt
