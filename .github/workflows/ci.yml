name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -e packages/stele-core -e packages/stele-mcp
      - name: OSS public tree verify
        run: bash scripts/verify_oss_public.sh
      - name: Lint (ruff)
        run: ruff check packages/ examples/
      - name: Types (mypy)
        run: mypy packages/stele-core/src/stele_core packages/stele-mcp/src/stele_mcp
      - name: Tests
        run: pytest -q
      - name: Proof run
        run: python examples/proof_run.py
      - name: Quickstart
        run: python examples/quickstart_core.py
      - name: Determinism smoke
        run: |
          python examples/lifecycle_demo.py > run1.txt
          python examples/lifecycle_demo.py > run2.txt
          diff run1.txt run2.txt

  mysql-parity:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: stele_ci
          MYSQL_DATABASE: stele_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -e "packages/stele-core[mysql]" -e packages/stele-mcp
      - name: MySQL roundtrip tests
        env:
          STELE_STORE_DSN: mysql://root:stele_ci@127.0.0.1:3306/stele_test
          STELE_MYSQL_SSL_DISABLED: "1"
        run: pytest -q packages/stele-core/tests/test_mysql_store.py
