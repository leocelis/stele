# Stele — monorepo workspace root
# Packages under packages/:
#   stele-core  (stele_core)  — governed experiential-memory ledger (zero runtime deps)
#   stele-mcp   (stele_mcp)   — MCP stdio server wrapping stele-core

[project]
name = "stele-workspace"
version = "0"
description = "Stele monorepo workspace (not published)."
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/stele-core", "packages/stele-mcp"]

[tool.uv.sources]
stele-core = { workspace = true }
stele-mcp = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["packages/stele-core/tests", "packages/stele-mcp/tests"]
pythonpath = [
    "packages/stele-core/src",
    "packages/stele-core/tests",
    "packages/stele-mcp/src",
]
addopts = "--import-mode=importlib"
consider_namespace_packages = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
